<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>

    <div class="container">
      <button id="toggle_calc_btn">&equals;</button>

      <!-- calculator -->
      <div class="hidden calculator">
        <div class="display_container">
        <label for="display" class="display-label">Display</label>
        <input type="textarea" id="display" class="display"/>
      </div>
      <div class="keys">
        <button class="btn_keys"  id="clear_btn_key">AC</button>
        <button class="btn_keys" id="delete_btn_key">DEL</button>
        <button class="btn_keys">%</button>
        <button class="btn_keys">&divide;</button>
        <button class="btn_keys">7</button>
        <button class="btn_keys">8</button>
        <button class="btn_keys">9</button>
        <button class="btn_keys">&times;</button>
        <button class="btn_keys">4</button>
        <button class="btn_keys">5</button>
        <button class="btn_keys">6</button>
        <button class="btn_keys">-</button>
        <button class="btn_keys">1</button>
        <button class="btn_keys">2</button>
        <button class="btn_keys">3</button>
        <button class="btn_keys">&plus;</button>
        <button class="btn_keys recycle">&#8635</button>
        <button class="btn_keys">0</button>
        <button class="btn_keys">.</button>
        <button class="btn_keys" id="equal_btn_key">&equals;</button>
      </div>
      </div>
      </div>
    <script src="./script.js"></script>
  </body>
</html>
